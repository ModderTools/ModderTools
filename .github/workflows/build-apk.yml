name: Build Modder Tools APK

# Builds a debug APK on every push/PR to main, and lets you trigger it
# manually from the Actions tab. No gradle-wrapper.jar is committed to this
# repo — gradle/actions/setup-gradle installs Gradle itself, so there's
# nothing binary for GitHub, git, or this workflow to choke on.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: modder-tools-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
